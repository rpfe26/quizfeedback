services:
  quizfeedback:
    build: .
    container_name: quizfeedback-app
    restart: unless-stopped
    ports:
      - "3050:3000"
    volumes:
      - quizfeedback_data:/app/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production

volumes:
  quizfeedback_data:
    driver: local
